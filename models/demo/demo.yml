models:
  - name: employee
    description: Employee DBT model
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments: 
                values: ['1','2','3','4','5']
                config:
                  severity: warn
      - name: emp_salary
        data_tests:
          - salary_check
  - name: customer
    description: Customer DBT model
  - name: customer_vw
    description: Customer View model
  - name: sales
    description: Sales DBT model
  - name: purchase
    description: Purchase DBT model

sources:
  - name: employeex
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customerx
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
    
  - name: salesx
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
    
  - name: purchasex
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC